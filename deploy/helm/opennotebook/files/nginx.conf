# Served by nginx-unprivileged (port 8080, non-root).

# Re-resolve the api through Docker's DNS: when the api container is recreated (upgrade, scale) it gets a new
# address, and a name resolved once at start-up would give 502 errors until the web container restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream opennotebook_api {
    zone opennotebook_api 64k;
    server api:8000 resolve;
    keepalive 16;
}

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    client_max_body_size 500m;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://opennotebook_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (chat streaming) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 600s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # pdf.js worker: an ES module, which browsers only accept with a JavaScript MIME type
    # (the stock mime.types has no entry for .mjs).
    location ^~ /pdfjs/ {
        types { }
        default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
