{{- $fn := include "on.fullname" . }}
{{- $secret := include "on.secretName" . }}
{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fn }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "on.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "on.selector" (list . "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: POSTGRES_PASSWORD } }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }, { name: shm, mountPath: /dev/shm }]
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes: [{ name: shm, emptyDir: { medium: Memory, sizeLimit: 256Mi } }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgresql.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "on.selector" (list . "postgres") | nindent 4 }}
  ports: [{ name: pg, port: 5432 }]
---
{{- end }}
{{- if .Values.qdrant.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-qdrant
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fn }}-qdrant
  replicas: 1
  selector:
    matchLabels: {{- include "on.selector" (list . "qdrant") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "on.selector" (list . "qdrant") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: QDRANT_API_KEY } }
            - { name: QDRANT__TELEMETRY_DISABLED, value: "true" }
          ports: [{ name: http, containerPort: 6333 }]
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /qdrant/storage }]
          resources: {{- toYaml .Values.qdrant.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.qdrant.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.qdrant.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-qdrant
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "on.selector" (list . "qdrant") | nindent 4 }}
  ports: [{ name: http, port: 6333 }]
---
{{- end }}
{{- if .Values.seaweedfs.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-seaweedfs
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fn }}-seaweedfs
  replicas: 1
  selector:
    matchLabels: {{- include "on.selector" (list . "seaweedfs") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "on.selector" (list . "seaweedfs") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /tmp/s3.json <<EOF
              {"identities":[{"name":"opennotebook","credentials":[{"accessKey":"$S3_ACCESS_KEY","secretKey":"$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
              EOF
              exec weed server -dir=/data -ip=$(hostname -f) -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.config=/tmp/s3.json
          env:
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: S3_SECRET_KEY } }
          ports: [{ name: s3, containerPort: 8333 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/status"] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }, { name: tmp, mountPath: /tmp }]
          resources: {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
      volumes: [{ name: tmp, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.seaweedfs.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.seaweedfs.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-seaweedfs
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "on.selector" (list . "seaweedfs") | nindent 4 }}
  ports: [{ name: s3, port: 8333 }]
---
{{- end }}
{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-redis
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fn }}-redis
  replicas: 1
  selector:
    matchLabels: {{- include "on.selector" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "on.selector" (list . "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes --save ''"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-redis
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "on.selector" (list . "redis") | nindent 4 }}
  ports: [{ name: redis, port: 6379 }]
{{- end }}
