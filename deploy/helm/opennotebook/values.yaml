# OpenNotebook Helm chart. Defaults run a complete single-replica instance with bundled data services
# (PostgreSQL, Qdrant, SeaweedFS, Redis) for evaluation and small teams; for production prefer managed or
# operator-run data services (set <service>.enabled=false and the external.* settings).

image:
  registry: lordraw
  # defaults to the chart appVersion
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# --- Secrets -------------------------------------------------------------------------------------------
# Either an existing Secret with the keys below, or values generated at install (kept across upgrades).
#   APP_SECRET_KEY, APP_ENCRYPTION_KEY, POSTGRES_PASSWORD, QDRANT_API_KEY, REDIS_PASSWORD, S3_ACCESS_KEY,
#   S3_SECRET_KEY, BOOTSTRAP_ADMIN_PASSWORD, plus any provider key (GROQ_API_KEY, MISTRAL_API_KEY, ...)
existingSecret: ""
# Model provider keys (stored in the generated Secret; imported as providers at first start).
providerKeys: {}
#  GROQ_API_KEY: ""
#  MISTRAL_API_KEY: ""
#  GEMINI_API_KEY: ""

# --- Application settings ------------------------------------------------------------------------------
# Any setting of .env.example (non-secret), as strings. Service URLs are set by the chart.
config:
  APP_ENV: production
  APP_PUBLIC_URL: http://opennotebook.example.com
  LOG_LEVEL: INFO
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  UPLOAD_MAX_MB: "500"
  # MODEL_CHAT: groq/llama-3.3-70b-versatile
  # MODEL_EMBEDDING: mistral/mistral-embed
  # OLLAMA_API_BASE: http://ollama.lan:11434
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger-collector.observability:4318

# --- Application components ----------------------------------------------------------------------------
web:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  service:
    type: ClusterIP
    port: 8080

api:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }

worker:
  replicas: 1
  # Celery concurrency per pod (jobs are I/O-bound: provider calls)
  concurrency: 4
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 4Gi }

migrate:
  # Job running `opennotebook migrate && opennotebook bootstrap` at every install/upgrade
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400

# Git repository sources: hosts that may be cloned (http/https), comma-separated, port when not default.
# Empty = off. The worker must be able to reach them.
git:
  allowedHosts: ""

# Isolated office-to-PDF converter (headless LibreOffice): PPTX, XLSX, ODF, DOC/XLS/PPT, RTF and DOCX pages.
converter:
  enabled: false
  concurrency: 2
  timeoutSeconds: 180
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 2Gi }

ingress:
  enabled: false
  className: ""
  host: opennotebook.example.com
  annotations: {}
  # The chat is a server-sent event stream: disable response buffering and allow long reads, e.g. for
  # ingress-nginx:
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  #   nginx.ingress.kubernetes.io/proxy-body-size: "500m"
  tls: []
  #  - secretName: opennotebook-tls
  #    hosts: [opennotebook.example.com]

# NetworkPolicies mirroring the Compose networks: data services accept connections from the api, worker and
# migration job only; the converter accepts connections from the worker only and has no egress at all.
networkPolicy:
  enabled: true
  # pods allowed to scrape the api (:8000/metrics) and worker (:9101) metrics, e.g. Prometheus
  metricsFrom: []
  #  - namespaceSelector:
  #      matchLabels: { kubernetes.io/metadata.name: monitoring }

podSecurityContext:
  seccompProfile: { type: RuntimeDefault }

nodeSelector: {}
tolerations: []
affinity: {}

# --- Bundled data services (single replica; disable to use external ones) ------------------------------
postgresql:
  enabled: true
  image: postgres:18.6-alpine
  database: opennotebook
  user: opennotebook
  storage: 10Gi
  storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 2Gi }

qdrant:
  enabled: true
  image: qdrant/qdrant:v1.20.0
  storage: 20Gi
  storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 4Gi }

seaweedfs:
  enabled: true
  image: chrislusf/seaweedfs:4.52
  storage: 50Gi
  storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

redis:
  enabled: true
  image: redis:8.8.4-alpine
  storage: 1Gi
  storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

# Used when the bundled service is disabled (passwords/keys still come from the Secret).
external:
  postgresql: { host: "", port: 5432, database: opennotebook, user: opennotebook }
  qdrantUrl: ""
  redisUrl: ""           # redis://host:6379/0
  s3: { endpoint: "", bucket: opennotebook, region: us-east-1 }
