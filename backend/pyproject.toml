[project]
name = "opennotebook"
version = "0.1.0"
description = "OpenNotebook backend: API, ingestion worker and model gateway"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "TBD" }
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.16,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "psycopg[binary]>=3.3,<3.4",
  "alembic>=1.20,<1.21",
  "argon2-cffi>=25.1,<26",
  "pyjwt>=2.15,<3",
  "cryptography>=50,<51",
  "httpx>=0.28,<0.29",
  "redis>=8.1,<9",
  "celery>=5.6,<5.7",
  "boto3>=1.43,<2",
  # LiteLLM is pinned to an exact version and installed from the hash-locked uv.lock
  # (supply-chain hardening, see docs/analysis/04-threat-model.md T15).
  "litellm==1.108.0",
  "prometheus-client>=0.22,<1",
]

[project.scripts]
opennotebook = "opennotebook.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opennotebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S108"]
"migrations/*" = ["E501"]
