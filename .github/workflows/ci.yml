name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: opennotebook
          POSTGRES_PASSWORD: test
          POSTGRES_DB: opennotebook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opennotebook" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.31"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Migrations are in sync with models
        env:
          DATABASE_URL: postgresql+psycopg://opennotebook:test@127.0.0.1:5432/opennotebook
        run: uv run opennotebook migrate && uv run alembic check
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://opennotebook:test@127.0.0.1:5432/opennotebook_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/15

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Italian translations cover every marked UI text
        run: node ../scripts/check-i18n.mjs
      - run: npm test
      - run: npx ng build --configuration production

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: helm lint deploy/helm/opennotebook
      - name: Render and validate the manifests (default, external data services, converter)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          chart=deploy/helm/opennotebook
          helm template rel $chart --set converter.enabled=true --set ingress.enabled=true | ./kubeconform -strict -summary -kubernetes-version 1.33.0
          helm template rel $chart --set postgresql.enabled=false --set qdrant.enabled=false --set seaweedfs.enabled=false --set redis.enabled=false \
            --set external.postgresql.host=pg --set external.qdrantUrl=http://q:6333 --set external.redisUrl=redis://r:6379/0 \
            --set external.s3.endpoint=http://s3:9000 --set existingSecret=mine | ./kubeconform -strict -summary -kubernetes-version 1.33.0

  dependencies:
    # Known vulnerabilities in the shipped dependencies (exceptions, if any: docs/operations/security.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > /tmp/requirements.txt
          # audit exactly the locked versions (the lock applies uv overrides that pip would not re-resolve)
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --no-deps --progress-spinner off $(sed -e 's/#.*//' ../.pip-audit-ignore | xargs -r -n1 echo --ignore-vuln)
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: npm dependencies (npm audit)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Release version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Generate a throwaway env file
        run: scripts/gen-secrets.sh .env.ci
      - run: make build ENV_FILE=.env.ci
      - run: make check-no-models ENV_FILE=.env.ci
      - name: Image vulnerability scan (HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: lordraw/opennotebook-api:${{ env.VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Web image vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: lordraw/opennotebook-web:${{ env.VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Converter image vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: lordraw/opennotebook-converter:${{ env.VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: SBOM (SPDX) of the api/worker image
        uses: anchore/sbom-action@v0.24.2
        with:
          image: lordraw/opennotebook-api:${{ env.VERSION }}
          format: spdx-json
          artifact-name: opennotebook-api.spdx.json
      - name: Production Compose observability config in sync
        run: python3 scripts/sync_observability.py --check
      - name: Validate the deployment Compose file
        run: cp .env.ci deploy/production/.env && docker compose -f deploy/production/docker-compose.yml --profile auth --profile observability --profile converter config --quiet
