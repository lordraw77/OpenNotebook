# OpenNotebook — deployment Compose file (published images, no source tree needed).
#
# Put this file and a `.env` in the same directory, then:
#   docker compose up -d                                   # core stack
#   docker compose --profile observability up -d           # + Prometheus and Grafana
#   docker compose --profile auth up -d                    # + Keycloak (OIDC single sign-on)
# or set COMPOSE_PROFILES=auth,observability in .env.
#
# Images: ${REGISTRY}/opennotebook-{web,api,worker}:${VERSION} (Docker Hub: lordraw/opennotebook-*).
# Create `.env` from .env.example and fill the secrets: scripts/gen-secrets.sh .env (see docs/deploy.md).
# No service in any profile runs a model: every model call goes to an external provider.

name: opennotebook

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-app: &app
  image: ${REGISTRY:-lordraw}/opennotebook-api:${VERSION:-1.2.0}
  pull_policy: missing
  env_file:
    - path: .env
      required: true
  environment:
    POSTGRES_HOST: postgres
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://seaweedfs:8333
  restart: unless-stopped
  <<: *hardening
  tmpfs:
    - /tmp
  logging: *logging
  networks: [internal, egress]

services:
  web:
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    pids_limit: 256
    image: ${REGISTRY:-lordraw}/opennotebook-web:${VERSION:-1.2.0}
    pull_policy: missing
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    <<: *hardening
    tmpfs:
      - /tmp
      - /var/cache/nginx
    logging: *logging
    networks: [internal, public]

  api:
    <<: *app
    mem_limit: ${API_MEM_LIMIT:-2g}
    pids_limit: 512
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    <<: *app
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    pids_limit: 1024
    image: ${REGISTRY:-lordraw}/opennotebook-worker:${VERSION:-1.2.0}
    command: ["worker"]
    networks: [internal, egress, convert]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Office documents to PDF (headless LibreOffice), `converter` profile; set CONVERTER_URL=http://converter:8080.
  # Threat T5: LibreOffice parses untrusted files, so it runs alone on the `convert` network (internal: no
  # internet, no database, no storage), reachable only by the worker.
  converter:
    profiles: [converter]
    image: ${REGISTRY:-lordraw}/opennotebook-converter:${VERSION:-1.2.0}
    environment:
      CONVERTER_CONCURRENCY: ${CONVERTER_CONCURRENCY:-2}
      CONVERTER_TIMEOUT_SECONDS: ${CONVERTER_TIMEOUT_SECONDS:-180}
      CONVERTER_MAX_MB: ${UPLOAD_MAX_MB:-500}
    mem_limit: ${CONVERTER_MEM_LIMIT:-2g}
    pids_limit: 256
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [convert]

  migrate:
    <<: *app
    mem_limit: ${API_MEM_LIMIT:-2g}
    pids_limit: 512
    # Migrations, then idempotent first-start initialization: admin user, storage bucket,
    # providers from .env keys, model catalog sync and MODEL_* defaults. Runs on every `up`.
    entrypoint: ["sh", "-c"]
    command: ["opennotebook migrate && opennotebook bootstrap"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  postgres:
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    pids_limit: 512
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opennotebook}
      POSTGRES_USER: ${POSTGRES_USER:-opennotebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (scripts/gen-secrets.sh)}
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    shm_size: 256m
    logging: *logging
    networks: [internal]

  qdrant:
    mem_limit: ${QDRANT_MEM_LIMIT:-4g}
    pids_limit: 1024
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env (scripts/gen-secrets.sh)}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  seaweedfs:
    mem_limit: ${SEAWEEDFS_MEM_LIMIT:-1g}
    pids_limit: 512
    image: chrislusf/seaweedfs:4.52
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env (scripts/gen-secrets.sh)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (scripts/gen-secrets.sh)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"opennotebook","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.config=/tmp/s3.json
    volumes:
      - blob-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  redis:
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    pids_limit: 256
    image: redis:8.8.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (scripts/gen-secrets.sh)}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --save ''"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  # --- profile: auth ---------------------------------------------------------------------------
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
      # Browsers use the public URL (token issuer); the api reaches Keycloak at http://keycloak:8081
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-8081}:8081"
    volumes:
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped
    logging: *logging
    networks: [internal, public]

  # --- profile: observability -------------------------------------------------------------------
  # >>> observability (generated by scripts/sync_observability.py - do not edit)
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-alerts
        target: /etc/prometheus/alerts.yml
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    logging: *logging
    networks: [internal, public]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/opennotebook.yml
      - source: grafana-dashboard-overview
        target: /etc/grafana/dashboards/opennotebook-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    restart: unless-stopped
    logging: *logging
    networks: [internal, public]

  # Traces (OpenTelemetry): set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env to enable them.
  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_BIND:-127.0.0.1}:${JAEGER_PORT:-16686}:16686"
    restart: unless-stopped
    logging: *logging
    networks: [internal, public]
  # <<< observability

# Observability configuration inline, so this file needs nothing else from the repository.
# >>> observability configs (generated by scripts/sync_observability.py - do not edit)
configs:
  prometheus:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 30s

      rule_files:
        - /etc/prometheus/alerts.yml

      scrape_configs:
        - job_name: opennotebook-api
          metrics_path: /metrics
          static_configs:
            - targets: ["api:8000"]
        # every worker replica (docker compose up --scale worker=N) is discovered through DNS
        - job_name: opennotebook-worker
          dns_sd_configs:
            - names: ["worker"]
              type: A
              port: 9101
  prometheus-alerts:
    content: |
      # OpenNotebook alert rules (see docs/operations/slo.md and docs/operations/runbooks.md).
      groups:
        - name: opennotebook
          rules:
            - alert: OpenNotebookApiDown
              expr: up{job="opennotebook-api"} == 0
              for: 2m
              labels: { severity: critical }
              annotations:
                summary: The OpenNotebook api is not answering
                runbook: docs/operations/runbooks.md#api-down
            - alert: OpenNotebookWorkerDown
              expr: absent(up{job="opennotebook-worker"} == 1)
              for: 5m
              labels: { severity: critical }
              annotations:
                summary: No ingestion worker is running
                runbook: docs/operations/runbooks.md#worker-down
            - alert: OpenNotebookHighErrorRate
              expr: |
                sum(rate(opennotebook_http_requests_total{status=~"5.."}[5m]))
                  / clamp_min(sum(rate(opennotebook_http_requests_total[5m])), 1e-9) > 0.05
              for: 10m
              labels: { severity: warning }
              annotations:
                summary: More than 5% of API requests fail (availability SLO at risk)
                runbook: docs/operations/runbooks.md#errors
            - alert: OpenNotebookChatSlow
              expr: |
                histogram_quantile(0.95, sum by (le) (rate(opennotebook_chat_time_to_first_token_seconds_bucket{mode="chat"}[30m]))) > 8
              for: 30m
              labels: { severity: warning }
              annotations:
                summary: Chat time to first token p95 above 8 s
                runbook: docs/operations/runbooks.md#slow-chat
            - alert: OpenNotebookProviderErrors
              expr: |
                sum by (provider) (rate(opennotebook_provider_calls_total{outcome="error"}[15m]))
                  / clamp_min(sum by (provider) (rate(opennotebook_provider_calls_total[15m])), 1e-9) > 0.25
              for: 15m
              labels: { severity: warning }
              annotations:
                summary: "Provider {{ $$labels.provider }}: more than 25% of calls fail"
                runbook: docs/operations/runbooks.md#provider-outage
            - alert: OpenNotebookQueueBacklog
              expr: max(opennotebook_queue_depth) > 100
              for: 30m
              labels: { severity: warning }
              annotations:
                summary: Ingestion jobs are piling up
                runbook: docs/operations/runbooks.md#queue-backlog
            - alert: OpenNotebookIngestionFailures
              expr: sum(increase(opennotebook_ingestion_jobs_total{status="failed"}[1h])) > 5
              labels: { severity: info }
              annotations:
                summary: More than 5 sources failed in the last hour
                runbook: docs/operations/runbooks.md#ingestion-failures
  grafana-datasources:
    content: |
      apiVersion: 1
      # Recreated at every start, so upgrades from installations without fixed uids provision cleanly.
      deleteDatasources:
        - name: Prometheus
          orgId: 1
        - name: Jaeger
          orgId: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
        - name: Jaeger
          uid: jaeger
          type: jaeger
          access: proxy
          url: http://jaeger:16686
  grafana-dashboards:
    content: |
      apiVersion: 1
      providers:
        - name: OpenNotebook
          folder: OpenNotebook
          type: file
          disableDeletion: true
          options:
            path: /etc/grafana/dashboards
  grafana-dashboard-overview:
    content: |
      {
        "uid": "opennotebook-overview",
        "title": "OpenNotebook overview",
        "tags": [
          "opennotebook"
        ],
        "timezone": "browser",
        "schemaVersion": 39,
        "refresh": "30s",
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "panels": [
          {
            "type": "stat",
            "title": "API availability (24 h, non-5xx)",
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "1 - (sum(increase(opennotebook_http_requests_total{status=~\"5..\"}[24h])) or vector(0)) / clamp_min(sum(increase(opennotebook_http_requests_total[24h])), 1)"
              }
            ],
            "id": 1
          },
          {
            "type": "stat",
            "title": "Chat TTFT p95 (1 h)",
            "gridPos": {
              "x": 6,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "histogram_quantile(0.95, sum by (le) (rate(opennotebook_chat_time_to_first_token_seconds_bucket{mode=\"chat\"}[1h])))"
              }
            ],
            "id": 2
          },
          {
            "type": "stat",
            "title": "Jobs waiting",
            "gridPos": {
              "x": 12,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(opennotebook_queue_depth)"
              }
            ],
            "id": 3
          },
          {
            "type": "stat",
            "title": "Failed sources",
            "gridPos": {
              "x": 18,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "opennotebook_sources{status=\"failed\"}"
              }
            ],
            "id": 4
          },
          {
            "type": "timeseries",
            "title": "API requests by status",
            "gridPos": {
              "x": 0,
              "y": 4,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (status) (rate(opennotebook_http_requests_total[5m]))",
                "legendFormat": "{{status}}"
              }
            ],
            "id": 5
          },
          {
            "type": "timeseries",
            "title": "API latency p95 by route",
            "gridPos": {
              "x": 12,
              "y": 4,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "histogram_quantile(0.95, sum by (le, route) (rate(opennotebook_http_request_duration_seconds_bucket{route!~\"/api/conversations/.*/messages\"}[5m])))",
                "legendFormat": "{{route}}"
              }
            ],
            "id": 6
          },
          {
            "type": "timeseries",
            "title": "Chat time to first token",
            "gridPos": {
              "x": 0,
              "y": 12,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "histogram_quantile(0.5, sum by (le, mode) (rate(opennotebook_chat_time_to_first_token_seconds_bucket[15m])))",
                "legendFormat": "p50 {{mode}}"
              },
              {
                "refId": "B",
                "expr": "histogram_quantile(0.95, sum by (le, mode) (rate(opennotebook_chat_time_to_first_token_seconds_bucket[15m])))",
                "legendFormat": "p95 {{mode}}"
              }
            ],
            "id": 7
          },
          {
            "type": "timeseries",
            "title": "Chat answers",
            "gridPos": {
              "x": 12,
              "y": 12,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (mode, status) (increase(opennotebook_chat_answers_total[1h]))",
                "legendFormat": "{{mode}} {{status}}"
              }
            ],
            "id": 8
          },
          {
            "type": "timeseries",
            "title": "Provider calls by outcome",
            "gridPos": {
              "x": 0,
              "y": 20,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (provider, outcome) (rate(opennotebook_provider_calls_total[5m]))",
                "legendFormat": "{{provider}} {{outcome}}"
              }
            ],
            "id": 9
          },
          {
            "type": "timeseries",
            "title": "Provider latency p95",
            "gridPos": {
              "x": 12,
              "y": 20,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "histogram_quantile(0.95, sum by (le, provider, phase) (rate(opennotebook_provider_call_duration_seconds_bucket[15m])))",
                "legendFormat": "{{provider}} {{phase}}"
              }
            ],
            "id": 10
          },
          {
            "type": "timeseries",
            "title": "Queue depth",
            "gridPos": {
              "x": 0,
              "y": 28,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "opennotebook_queue_depth",
                "legendFormat": "{{queue}}"
              }
            ],
            "id": 11
          },
          {
            "type": "timeseries",
            "title": "Sources by status",
            "gridPos": {
              "x": 12,
              "y": 28,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "opennotebook_sources",
                "legendFormat": "{{status}}"
              }
            ],
            "id": 12
          },
          {
            "type": "timeseries",
            "title": "Ingestion jobs",
            "gridPos": {
              "x": 0,
              "y": 36,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (kind, status) (increase(opennotebook_ingestion_jobs_total[15m]))",
                "legendFormat": "{{kind}} {{status}}"
              }
            ],
            "id": 13
          },
          {
            "type": "timeseries",
            "title": "Ingestion duration p95",
            "gridPos": {
              "x": 12,
              "y": 36,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            },
            "targets": [
