{{- if not .Values.existingSecret }}
{{- $name := include "on.secretName" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $gen := dict
  "APP_SECRET_KEY" (randAlphaNum 64)
  "APP_ENCRYPTION_KEY" (randAlphaNum 32 | b64enc)
  "POSTGRES_PASSWORD" (randAlphaNum 32)
  "QDRANT_API_KEY" (randAlphaNum 40)
  "REDIS_PASSWORD" (randAlphaNum 32)
  "S3_ACCESS_KEY" (randAlphaNum 20)
  "S3_SECRET_KEY" (randAlphaNum 40)
  "BOOTSTRAP_ADMIN_PASSWORD" (randAlphaNum 20)
-}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "on.labels" . | nindent 4 }}
  annotations:
    # generated values must survive `helm uninstall` together with the data they protect
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $gen }}
  {{- /* keep the values of an existing install: changing them would lock out the data */}}
  {{ $key }}: {{ get $old $key | default ($value | b64enc) }}
  {{- end }}
  {{- range $key, $value := .Values.providerKeys }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
