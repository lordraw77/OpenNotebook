{{- $fn := include "on.fullname" . }}
# ---- migration job: migrate + bootstrap at every install/upgrade -----------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fn }}-migrate-{{ .Release.Revision }}
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels: {{- include "on.selector" (list . "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "on.podCommon" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "on.image" (list . "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "opennotebook migrate && opennotebook bootstrap"]
          {{- include "on.appEnv" . | nindent 10 }}
          securityContext: {{- include "on.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
---
# ---- api -------------------------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-api
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "on.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "on.selector" (list . "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "on.podCommon" . | nindent 6 }}
      initContainers:
        - name: wait-migrations
          image: {{ include "on.image" (list . "api") }}
          args: ["wait-migrations"]
          {{- include "on.appEnv" . | nindent 10 }}
          securityContext: {{- include "on.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: api
          image: {{ include "on.image" (list . "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          {{- include "on.appEnv" . | nindent 10 }}
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext: {{- include "on.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-api
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  selector: {{- include "on.selector" (list . "api") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
---
# ---- worker ----------------------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-worker
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "on.selector" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "on.selector" (list . "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "on.podCommon" . | nindent 6 }}
      initContainers:
        - name: wait-migrations
          image: {{ include "on.image" (list . "worker") }}
          args: ["wait-migrations"]
          {{- include "on.appEnv" . | nindent 10 }}
          securityContext: {{- include "on.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: worker
          image: {{ include "on.image" (list . "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker", "--concurrency={{ .Values.worker.concurrency }}"]
          {{- include "on.appEnv" . | nindent 10 }}
          ports:
            - { name: metrics, containerPort: 9101 }
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A opennotebook.worker:celery_app inspect ping -d celery@$HOSTNAME --timeout 10 >/dev/null"]
            initialDelaySeconds: 40
            periodSeconds: 60
            timeoutSeconds: 20
          securityContext: {{- include "on.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
---
# ---- web (nginx serving the SPA, proxying /api to the api service) ---------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-nginx
  labels: {{- include "on.labels" . | nindent 4 }}
data:
  default.conf: |
{{- /* Kubernetes: the api Service has a stable ClusterIP, so no Docker-DNS re-resolution is needed */}}
{{- .Files.Get "files/nginx.conf" | replace "resolver 127.0.0.11 valid=10s ipv6=off;" "" | replace "server api:8000 resolve;" (printf "server %s-api:8000;" $fn) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-web
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "on.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "on.selector" (list . "web") | nindent 8 }}
      annotations:
        checksum/nginx: {{ .Files.Get "files/nginx.conf" | sha256sum }}
    spec:
      {{- include "on.podCommon" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "on.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext: {{- include "on.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - name: nginx
          configMap:
            name: {{ $fn }}-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-web
  labels: {{- include "on.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector: {{- include "on.selector" (list . "web") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.web.service.port }}, targetPort: http }
