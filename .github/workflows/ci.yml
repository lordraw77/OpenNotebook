name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: opennotebook
          POSTGRES_PASSWORD: test
          POSTGRES_DB: opennotebook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opennotebook" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.31"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Migrations are in sync with models
        env:
          DATABASE_URL: postgresql+psycopg://opennotebook:test@127.0.0.1:5432/opennotebook
        run: uv run opennotebook migrate && uv run alembic check
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://opennotebook:test@127.0.0.1:5432/opennotebook_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/15

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npx ng build --configuration production

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Generate a throwaway env file
        run: scripts/gen-secrets.sh .env.ci
      - run: make build ENV_FILE=.env.ci
      - run: make check-no-models ENV_FILE=.env.ci
