# Used for development commands such as `uv run alembic revision --autogenerate -m "..."`.
# At runtime migrations are applied with `opennotebook migrate`, which does not need this file.
[alembic]
script_location = src/opennotebook/migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
